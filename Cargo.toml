[workspace]

members = [
    "./crates/cli",
    "./crates/radlr",
    "./crates/radlr-build",
    "./crates/radlr-core", 
    "./crates/radlr-bytecode",
    "./crates/radlr-rust-runtime",
    "./crates/radlr-test",
    "./crates/radlr-formatter",
    "./crates/radlr-ascript",
    "./crates/radlr-wasm",
    "./crates/radlr-lab"
]

exclude = [
  "test"
]

resolver = "2"


[workspace.dependencies]
serde                    = { version = "1.0.188", features = ["derive"] }
serde-wasm-bindgen       = "0.6.0"
js-sys                   = "0.3.64"
wasm-bindgen             = { version = "0.2.100" }
wasm-bindgen-test        = "0.3.37"
console_error_panic_hook = "0.1.7"
wee_alloc                = "0.4.5"

[workspace.dependencies.web-sys]
version = "0.3.64"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Window',
  'console'
]

[profile.release]
opt-level=3
panic = 'abort'
lto = true
debug = 0

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.dev]
debug = 2

